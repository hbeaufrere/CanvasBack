services:
  - type: web
    name: canvasback
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data/db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: INSTRUCTOR_PASSWORD
        sync: false
      - key: STUDENT_PASSWORD
        sync: false
    disk:
      name: canvasback-data
      mountPath: /var/data
      sizeGB: 1
